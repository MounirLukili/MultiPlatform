publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  google_maps_flutter: ^2.6.0
  google_geocoding_api: ^1.0.1
  flutter_dotenv: ^6.0.0


